################
### MONITORS ###
################

monitor= eDP-1, 2880x1620@120, 0x0, 2


#############################
### ENVIRONMENT VARIABLES ###
#############################

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

env = TERMINAL,kitty
env = EDITOR,vim

# toolkit-specific scale
env = GDK_SCALE,2


###############
### CURSORS ###
###############

env = XCURSOR_THEME,Bibata-Original-Ice
env = XCURSOR_SIZE,28


###########################
### MY DEFAULT PROGRAMS ###
###########################

$terminal = kitty
$fileManager = nautilus --new-window
$menu = rofi -show drun - font "UbuntuMono Nerd Font" -icon-theme "Papirus" -show-icons


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = swww-daemon
exec-once = swaync
exec-once = swaync-client -df
#exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = ~/.config/scripts/battery_notify.sh &
exec-once = swayosd-server
exec-once = /usr/bin/lxqt-policykit-agent


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

general {
        gaps_in = 3 
        gaps_out = 8
        border_size = 1 
        resize_on_border = true
        allow_tearing = false
        layout = dwindle
}
decoration {
        rounding = 10
        active_opacity = 0.95
        inactive_opacity = 0.85
        fullscreen_opacity = 1
        dim_special = 0.1
        blur {
                enabled = true
                size = 3
                passes = 5
                new_optimizations = true
                ignore_opacity = true
                xray = false
                popups = true
        }
    shadow {
            enabled = true
            range = 5
            render_power = 2
    }
}
animations {
        enabled = true
        bezier = linear, 0,0,1,1
        bezier = swirl, 0.02, 1, 0.2, 1.2
        animation = windows, 1, 3, swirl, popin 0%
        animation = windowsOut, 1, 3, linear, popin 0%
        animation = fade, 1, 2, linear
        animation = workspaces, 1, 2, linear
        animation = specialWorkspace, 1, 6, swirl, slidefadevert -50%
}
dwindle {
        preserve_split = true
}
misc {
        force_default_wallpaper = 1
        disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0   # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gestures {
        workspace_swipe_distance = 100
        workspace_swipe_cancel_ratio = .05
        workspace_swipe_min_speed_to_force = 0
}
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = ALT, F4, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, togglefloating,
bind = $mainMod, F, fullscreen
bind = ALT, S, exec, $menu
bind = $mainMod, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Minimize (sort of)
#bind = $mainMod, X, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, R, resizewindow


