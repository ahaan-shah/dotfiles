####################
### Window Rules ###
####################

# Remember the size you manually resized for floating windows (per class + title)
# This makes "currently floating windows" open next time with the size you left them at
windowrule {
    name = remember-float-size
    match:class = .*
    persistent_size = on
}

# Global: Float everything by default + sensible default size + center new windows
windowrule {
    name = global-float
    match:class = .*
    float = on
    size = 800 480     # ← Change this to whatever default you prefer (percentages are reliable across monitors)
    center = on
}

# Kitty (terminal)
windowrule {
    name = kitty-float
    match:class = ^(kitty)$
    float = on
    size = 750 430
    center = on
}

# Browsers
windowrule {
    name = browsers-float
    match:class = ^(librewolf|brave-browser|chromium|chromium-browser)$
    float = on
    center = on
    size = 1250 660
}

# All Kitty-based tools (bluetui, nmtui, etc.)
windowrule {
    name = kitty-tools-float
    match:class = ^(kitty)$
    match:title = ^(bluetui|nmtui|pulsemixer|wiremix|calcurse)$
    float = on
    center = on
    size = 810 450
}

# MPV
windowrule {
    name = mpv-float
    match:class = ^(mpv)$
    float = on
    size = 800 450
    center = on
}

# Zathura (PDF viewer) - just float, let it use its natural size or persistent_size
windowrule {
    name = zathura-float
    match:class = ^(org.pwmt.zathura)$
    float = on
}

# Calculator
windowrule {
    name = calc-float
    match:class = ^(org.gnome.Calculator)$
    float = on
    size = 380 615
    center = on
}

# Calendar
windowrule {
    name = calendar-float
    match:class = ^(org.gnome.Calendar)$
    float = on
    center = on
    size = 620 600
}

# imv
windowrule {
    name = imv-float
    match:class = ^(imv)$
    float = on
    size = 700 400
    center = on
}

# Browser upload files
windowrule {
    name = file-upload-float
    match:class = ^(xdg-desktop-portal-gtk|Firefox)$
    match:title = ^(Open Files|File Upload)$
    float = on
    center = on
    size = 800 500
}

# Nomacs
windowrule {
    name = nomacs-float
    match:class = ^(org.nomacs.ImageLounge)$
    workspace = special:magic
    no_blur = on
    border_size = 1
    no_shadow = on
}

# Nautilus
windowrule {
    name = nautilus-float
    match:class = ^(org.gnome.Nautilus)$
    float = on
    size = 850 500
    center = on
}

# Evince Docs
windowrule {
    name = evince-float
    match:class = ^(org.gnome.Evince)$
    float = on
    center = on
    size = 580 680
}

# Camera
windowrule {
    name = camera-float
    match:class = ^(org.gnome.Snapshot)$
    float = on
    center = on
    size = 740 420
}

# Spotify
windowrule {
    name = spotify-float
    match:class = ^(Spotify)$
    workspace = 8
}

# Instagram
windowrule {
    name = instagram-float
    match:class = ^(chrome-www.instagram.com__-Default)$
    float = on
    size = 950 550
    center = on
}
