##############################################################
############## THIS IS MY HYPRLAND CONFIG FILE! ##############
##############################################################

# Import pywal colors
source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################

monitor= eDP-1, 2880x1620@120, 0x0, 2
#monitor= HDMI-A-1, 1920x1080@60, 0x0, 1


#############################
### ENVIRONMENT VARIABLES ###
#############################

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

env = TERMINAL,kitty
env = EDITOR,vim

# toolkit-specific scale
env = GDK_SCALE,2


###############
### CURSORS ###
###############

env = XCURSOR_THEME,Bibata-Original-Ice
env = XCURSOR_SIZE,28


###########################
### MY DEFAULT PROGRAMS ###
###########################

$terminal = kitty
$menu = walker
$fileManager = nautilus --new-window


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = swww-daemon
exec-once = swaync
exec-once = swaync-client -df
exec-once = swayosd-server
exec-once = elephant
exec-once = hyprpm reload
exec-once = walker --gapplication-service
exec-once = /usr/bin/lxqt-policykit-agent

exec-once = ~/.config/scripts/battery_notify.sh &
exec-once = ~/.config/scripts/waybar-restart.sh
exec-once = ~/.config/macdock/macdock-launch.sh


#exec-once = wl-paste --type text --watch cliphist store # Stores only text data
#exec-once = wl-paste --type image --watch cliphist store # Stores only image data
#exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0

#####################
### LOOK AND FEEL ###
#####################

general {
        gaps_in = 3 
        gaps_out = 5
        border_size = 2
        col.active_border = $color7
        resize_on_border = true
        allow_tearing = false
        layout = dwindle
}
decoration {
        rounding = 16
        active_opacity = 0.95
        inactive_opacity = 0.85
        fullscreen_opacity = 1
        dim_special = 0.1
        blur {
                enabled = true
                size = 3
                passes = 5
                new_optimizations = true
                ignore_opacity = true
                xray = false
                popups = true
        }
    shadow {
            enabled = true
            range = 5
            render_power = 2
    }
}
animations {
        enabled = true
        bezier = linear, 0,0,1,1
        bezier = swirl, 0.02, 1, 0.2, 1.2
        animation = windows, 1, 3, swirl, popin 0%
        animation = windowsOut, 1, 3, linear, popin 0%
        animation = fade, 1, 2, linear
        animation = workspaces, 1, 2, linear
        animation = specialWorkspaceIn, 1, 6, swirl, slidefadevert -50%
        animation = specialWorkspaceOut, 1, 6, swirl, fade
}
dwindle {
        preserve_split = true
}
misc {
        force_default_wallpaper = 1
        disable_hyprland_logo = true
        focus_on_activate = true
        permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
}

plugin {
    hyprbars {
        bar_height = 22
        bar_blur = false
        bar_part_of_window = true
        bar_precedence_over_border = true

        bar_color = $color8                 #$background for dark version
        col.text = rgba(255, 255, 255, 0)

        bar_text_size = 10
        bar_text_font = Hack Nerd Font Propo
        bar_text_align = center
        bar_title_enabled = false

        bar_button_padding = 5
        bar_padding = 8
        icon_on_hover = true

        hyprbars-button = rgb(ff5f57), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(febb2e), 12, , ~/.config/scripts/hyprbars-minimize.sh
        hyprbars-button = rgb(28c840), 12, , hyprctl dispatch resizeactive exact 1425 655 && hyprctl dispatch centerwindow

        bar_buttons_alignment = left
    }
    
    hymission {
    }
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 0
    sensitivity = 0   # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# Gestures
#gesture = 3, horizontal, scale:1.5, workspace

device {
    name = asup1204:00-093a:2642-touchpad
    enabled = true
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = ALT, S, exec, $menu
bind = $mainMod, C, killactive,
bind = $mainMod, W, togglefloating,
bind = $mainMod, D, exec, hyprctl dispatch resizeactive exact 1425 710 && hyprctl dispatch centerwindow  #740 without hyprbars and 700 with
bind = $mainMod, F, fullscreen

bind = SUPER, T, exec, hyprctl dispatch plugin:xtd:throwunfocused 4 

# Move focus with mainMod + arrow keys
bind = SUPER, left,  movefocus, l
bind = SUPER, left,  bringactivetotop,

bind = SUPER, right, movefocus, r
bind = SUPER, right, bringactivetotop,

bind = SUPER, up,    movefocus, u
bind = SUPER, up,    bringactivetotop,

bind = SUPER, down,  movefocus, d
bind = SUPER, down,  bringactivetotop,

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = SUPER, X, exec, hyprctl dispatch movetoworkspacesilent special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Alt+Tab window switcher (current workspace only)
bind = ALT, TAB, cyclenext
bind = ALT, TAB, alterzorder, top

# Optional: To go backwards (highly recommended)
bind = ALT, Q, cyclenext, prev hist
bind = ALT, Q, alterzorder, top

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, R, resizewindow

#Hymission
#bind = SUPER, A, hymission:open
bind = SUPER, A, exec, ~/.config/scripts/hymission-fix.sh

#Toggle Layout
bind = SUPER, T, exec, ~/.config/scripts/toggle-layout.sh

