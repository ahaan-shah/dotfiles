####################
### Window Rules ###
####################

#bluetui
windowrule = match:class ^(kitty)$, match:title ^(bluetui)$, float on, center on, size 810 450

#nmtui
windowrule = match:class ^(kitty)$, match:title ^(nmtui)$, float on, center on, size 810 450

#pulsemixer
windowrule = match:class ^(kitty)$, match:title ^(pulsemixer)$, float on, center on, size 810 450

#mpv
windowrule = match:class ^(mpv)$, float on, size 800 450

#zathura
windowrule = match:class ^(org.pwmt.zathura)$, float on

#calc
windowrule = match:class ^(org.gnome.Calculator)$, float on, size 420 560

#imv
windowrule = match:class ^(imv)$, float on, size 700 400

#Browser upload files
windowrule = match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open Files)$, float on, center on, size 800 500
windowrule = match:class ^(Firefox)$, match:title ^(File Upload)$, float on, center on, size 800 500

#nomacs
windowrule = match:class ^(org.nomacs.ImageLounge)$, float on, size 600 400, no_blur on, border_size 1, no_shadow on

#nautilus
windowrule = match:class ^(org.gnome.Nautilus)$, float on, size 850 500

#Evince Docs
windowrule = match:class ^(org.gnome.Evince)$, float on, center on, size 580 680

#spotify
windowrule = match:class ^(spotify)$, workspace special:magic 

#instagram
windowrule = match:class ^(chrome-www.instagram.com__-Default)$, float on, size 950 550
