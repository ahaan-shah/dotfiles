general {
    # hyprlock replaced by the Quickshell lockscreen/ app — lockscreen/
    # is now a PERSISTENT process (autostarted by hyprland.lua), not
    # spawned fresh per lock, so this just tells the already-running
    # instance to lock over IPC instead of launching a new one — see
    # lockscreen-launch.sh for why (cold-starting Quickshell on every lock
    # was the cause of a multi-second unlocked-desktop flash after waking
    # from sleep).
    # lock_cmd (old, pre-hyprlock) = pidof hyprlock || hyprlock
    # lock_cmd (old, pre-persistent) = ~/.config/lockscreen/lockscreen-launch.sh
    lock_cmd = ~/.config/lockscreen/lockscreen-launch.sh lock
    # DEBUG (temporary — remove once the fprint/idle bug below is confirmed
    # fixed): on_lock_cmd/on_unlock_cmd fire off hypridle's *native*
    # hyprland_lock_notifier_v1 signal — the actual Wayland-level lock state,
    # independent of the pgrep-based condition_cmd checks further down. Diffing
    # these timestamps against the "LOCK listener" / "DPMS-OFF" lines below
    # will show conclusively whether a stray real input silently re-armed the
    # 120s lock listener after an unlock (re-locking for real, in which case
    # a later dpms-off is correct-per-design) vs. the condition_cmd gate
    # actually failing to suppress it (a real bug in the gate itself).
    on_lock_cmd = echo "$(date '+%T') [native] LOCKED" >> /tmp/hypridle-debug.log
    on_unlock_cmd = echo "$(date '+%T') [native] UNLOCKED" >> /tmp/hypridle-debug.log
    ignore_dbus_inhibit = /opt/spotify/spotify
    before_sleep_cmd = loginctl lock-session           # lock before suspend.
    # after_sleep_cmd (old) = hyprctl dispatch d — pre-0.55 syntax (and "d"
    # was never a valid dispatcher name either); hyprctl dispatch takes a
    # Lua expression string as of 0.55, see Using-hyprctl.md.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # avoid having to press a key twice to turn on the display.
}


listener {
    timeout = 120                                                 # 2 minutes
    # DEBUG: log every time this actually fires — if it fires a 2nd time
    # after an unlock with no keyboard/mouse touch in between, some real
    # input (trackpad brush, lid angle, etc.) silently reset the idle clock.
    on-timeout = echo "$(date '+%T') LOCK listener fired" >> /tmp/hypridle-debug.log; loginctl lock-session   # lock screen when timeout has passed
}

listener {
    timeout = 179
    on-timeout = brightnessctl -d asus::kbd_backlight get > /tmp/kbd_brightness_before
}

# condition_cmd/condition_retry would be hypridle's own native gate primitive
# for exactly this (checked via ConfigManager.cpp/Hypridle.cpp — exit 0 =
# proceed with on-timeout, nonzero = skip it) — cleaner than hand-rolling
# `pgrep && cmd` inline in on-timeout. BUT: this installed build (hypridle
# v0.1.7) rejects it outright — "config option <listener:condition_cmd> does
# not exist" — confirmed live via `hypridle -v`, config load errored on both
# uses and fell back to running the listener with NO gate at all. That
# option only exists on hypridle's main branch, added after this release.
# So back to inline `pgrep && cmd`, same as originally deployed, just with
# logging added this time (see general{} and the 120s listener above) so a
# repro can actually be diagnosed instead of guessed at again.
#
# Why gate at all: Hyprland's real input-idle clock (ext-idle-notify-v1,
# which every listener here times against) only resets on actual
# keyboard/mouse activity — fingerprint unlock (lockscreen/LockContext.qml's
# fprintd path) never touches a keyboard or mouse, so it does NOT reset this
# clock. Without the gate, a fingerprint-unlock at e.g. 150s idle left the
# clock still counting toward 180s from the ORIGINAL last real input, so the
# screen (and kbd backlight) blanked ~30s later even though the user had
# already unlocked and was sitting there using the desktop. Password unlock
# doesn't hit this because typing the password is itself real keyboard input
# that resets the clock. lockscreen/shell.qml's onUnlocked sets locked=false
# then Qt.quit()s, so once truly unlocked this pgrep comes up empty and
# on-timeout no-ops instead of blanking a session that isn't idle/locked
# anymore; while genuinely still idle+locked (the normal "walked away"
# case), the process is still running and this fires exactly as before.
#
# NOTE: user reported the screen still went black ~60s after an fprint
# unlock with an earlier, unlogged version of this same gate deployed. That
# version's logic looked sound on paper and the config reloaded clean, so
# rather than guess again blind, this version logs the gate's own check
# result on every firing, plus (via general{} and the 120s listener above)
# whether a real re-lock silently happened after the unlock — that'd make a
# later dpms-off correct-per-design (just surprising) rather than a bug in
# the gate itself. Next repro's /tmp/hypridle-debug.log settles which one it
# is instead of another blind guess.
#
# UPDATE: lockscreen/ is now a persistent process (see lockscreen-launch.sh
# / shell.qml), so `pgrep -f "quickshell -c .../lockscreen"` is ALWAYS true
# once the session's started, locked or not — it stopped being a valid
# still-locked proxy the moment the process quit being spawned-per-lock.
# Switched both gates below to actually query WlSessionLock's real `locked`
# property over Quickshell's own IPC instead.
listener {
    timeout = 180                                                 # 3 minutes
    on-timeout = locked=$(qs -p $HOME/.config/lockscreen ipc call lock isLocked 2>/dev/null); echo "$(date '+%T') DPMS-OFF check, still-locked=$locked" >> /tmp/hypridle-debug.log; [ "$locked" = "true" ] && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   # screen off when timeout has passed, but only if still locked
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 180                                                 # 3 minutes
    on-timeout = [ "$(qs -p $HOME/.config/lockscreen ipc call lock isLocked 2>/dev/null)" = "true" ] && brightnessctl -d asus::kbd_backlight set 0
    on-resume = bash -c 'val=$(cat /tmp/kbd_brightness_before 2>/dev/null || echo 0); [ "$val" -gt 0 ] && brightnessctl -d asus::kbd_backlight set "$val"'
}
