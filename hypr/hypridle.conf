general {
    # hyprlock replaced by the Quickshell lockscreen/ app — see
    # lockscreen-launch.sh for why this can't just be a pidof guard (every
    # Quickshell instance on this system shows up as plain "quickshell").
    # lock_cmd (old) = pidof hyprlock || hyprlock
    # No --instant here: an idle-timeout lock has nobody watching and is not
    # racing a suspend, so it keeps the full ~1s entrance animation.
    lock_cmd = ~/.config/lockscreen/lockscreen-launch.sh
    # DIAGNOSTIC, now retired. on_lock_cmd/on_unlock_cmd fire off hypridle's
    # *native* hyprland_lock_notifier_v1 signal — the actual Wayland-level lock
    # state, independent of the pgrep gate further down — so diffing their
    # timestamps against the "LOCK listener" / "DPMS-OFF" lines told us whether
    # a stray real input had silently re-armed the 120s lock listener after an
    # unlock (a genuine re-lock, making a later dpms-off correct-per-design)
    # versus the gate itself failing to suppress it. That question is settled;
    # these fired on every single lock and unlock, so they are off rather than
    # left running. Uncomment both (plus the two below) to re-arm the trace.
    # on_lock_cmd = echo "$(date '+%T') [native] LOCKED" >> /tmp/hypridle-debug.log
    # on_unlock_cmd = echo "$(date '+%T') [native] UNLOCKED" >> /tmp/hypridle-debug.log
    # ignore_dbus_inhibit = /opt/spotify/spotify
    # Disabled because hypridle rejects it: "cannot parse /opt/spotify/spotify
    # as an int" on every start. It is a boolean (ignore ALL dbus idle
    # inhibits) — hypridle has no per-application form — so this line was
    # always being discarded and Spotify's inhibit has in fact been honoured
    # the whole time. Left off rather than set to true, which would also stop
    # video players from holding off the idle lock. Behaviour is unchanged;
    # only the startup error is gone.
    # Hold the sleep inhibitor until the session is ACTUALLY locked.
    #
    # inhibit_sleep = 3 ("wait until locked") is the only correct setting here.
    # With the default, hypridle's PrepareForSleep handler does:
    #     spawn(before_sleep_cmd);            // async, never waited on
    #     handleInhibitOnDbusSleep(true);     // -> uninhibitSleep() immediately
    # so the inhibitor is dropped ~200ms in, while quickshell is still starting,
    # and the machine suspends with the desktop still the visible surface. On
    # resume you get a live, interactive desktop until the lock finally appears.
    # Measured: suspend requested 12:37:52.609 -> PM: suspend entry .812.
    # A blocking before_sleep_cmd cannot fix this — hypridle does not wait for it.
    #
    # With 3, handleInhibitOnDbusSleep() returns early and the inhibitor is
    # released only in onLocked(), driven by hyprland-lock-notify-v1 — the
    # compositor's own lock signal, not a guess about timing. Requires that
    # protocol, which this Hyprland has ("Bound to hyprland_lock_notifier_v1").
    inhibit_sleep = 3
    before_sleep_cmd = ~/.config/lockscreen/lockscreen-launch.sh --instant
    # after_sleep_cmd (old) = hyprctl dispatch d — pre-0.55 syntax (and "d"
    # was never a valid dispatcher name either); hyprctl dispatch takes a
    # Lua expression string as of 0.55, see Using-hyprctl.md.
    # dpms on: avoid having to press a key twice to turn on the display.
    # Then re-run the launcher as crash recovery: if the lock process died
    # while the compositor stayed locked, the session is stuck showing a solid
    # colour with nothing able to unlock it (normally a reboot). The launcher
    # is idempotent, so this is a no-op when the lock is healthy and restores
    # it when it is not.
    # Finally re-assert the battery charge cap: hibernate resets the EC, and the
    # kernel's cached sysfs value survives inside the restored image, so the cap
    # reads correct while the EC has silently dropped it. apply-battery-threshold.sh
    # forces a real EC transaction rather than re-writing an unchanged value.
    # battery-threshold.timer is the safety net for when hypridle is toggled off.
    # Then nudge the lock that is already up. The instance raised by
    # before_sleep_cmd is frozen by systemd ~100-200ms after the compositor
    # confirms it, and it comes back from a hibernate with the clock reading
    # the time the machine went down and a password field that takes no
    # keystrokes — fingerprint still unlocks, because that is a separate
    # process rather than the surface. Both clear the instant any real input
    # arrives, so what is missing is a nudge, not the machinery; this is that
    # nudge, delivered from the resume signal rather than guessed at inside a
    # process that was not running. `|| true` because the lock is legitimately
    # absent on a resume that was not preceded by a lock, and a nonzero exit
    # here must not stop the battery cap re-assert that follows.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; ~/.config/lockscreen/lockscreen-launch.sh --instant; qs -p ~/.config/lockscreen ipc call lock wake || true; ~/.config/scripts/apply-battery-threshold.sh
}


listener {
    timeout = 120                                                 # 2 minutes
    # Diagnostic form, retired along with the on_lock_cmd pair above — it
    # logged every firing so a second one after an unlock (i.e. some real
    # input, a trackpad brush or a lid-angle change, silently resetting the
    # idle clock) would be visible:
    # on-timeout = echo "$(date '+%T') LOCK listener fired" >> /tmp/hypridle-debug.log; loginctl lock-session
    on-timeout = loginctl lock-session                            # lock screen when timeout has passed
}

listener {
    timeout = 179
    # One second before the `off` listener below, so the value captured is the
    # pre-dim brightness. The LED name is no longer written here: hypridle.conf
    # cannot source hardware.env, so the whole backlight sequence goes through
    # a script that can. See scripts/kbd-backlight-idle.sh.
    on-timeout = ~/.config/scripts/kbd-backlight-idle.sh save
}

# condition_cmd/condition_retry would be hypridle's own native gate primitive
# for exactly this (checked via ConfigManager.cpp/Hypridle.cpp — exit 0 =
# proceed with on-timeout, nonzero = skip it) — cleaner than hand-rolling
# `pgrep && cmd` inline in on-timeout. BUT: this installed build (hypridle
# v0.1.7) rejects it outright — "config option <listener:condition_cmd> does
# not exist" — confirmed live via `hypridle -v`, config load errored on both
# uses and fell back to running the listener with NO gate at all. That
# option only exists on hypridle's main branch, added after this release.
# So back to inline `pgrep && cmd`, same as originally deployed. (A round of
# logging was added on top of it to diagnose the repro described at the bottom
# of this comment; that trace has served its purpose and is commented out here
# and in general{} above rather than left writing to /tmp on every timeout.)
#
# Why gate at all: Hyprland's real input-idle clock (ext-idle-notify-v1,
# which every listener here times against) only resets on actual
# keyboard/mouse activity — fingerprint unlock (lockscreen/LockContext.qml's
# fprintd path) never touches a keyboard or mouse, so it does NOT reset this
# clock. Without the gate, a fingerprint-unlock at e.g. 150s idle left the
# clock still counting toward 180s from the ORIGINAL last real input, so the
# screen (and kbd backlight) blanked ~30s later even though the user had
# already unlocked and was sitting there using the desktop. Password unlock
# doesn't hit this because typing the password is itself real keyboard input
# that resets the clock. lockscreen/shell.qml's onUnlocked sets locked=false
# then Qt.quit()s, so once truly unlocked this pgrep comes up empty and
# on-timeout no-ops instead of blanking a session that isn't idle/locked
# anymore; while genuinely still idle+locked (the normal "walked away"
# case), the process is still running and this fires exactly as before.
#
# HISTORY: the screen was once reported still going black ~60s after an fprint
# unlock with an earlier version of this same gate deployed, which is what the
# now-retired logging was added to settle. The gate below is the surviving
# form; to investigate a recurrence, restore the logged variant kept as the
# commented on-timeout line and re-enable the on_lock_cmd pair in general{}.
listener {
    timeout = 180                                                 # 3 minutes
    # Logged variant, retired:
    # on-timeout = pgrep -f "quickshell -c $HOME/.config/lockscreen" > /dev/null; locked=$?; echo "$(date '+%T') DPMS-OFF check, still-locked=$([ $locked -eq 0 ] && echo yes || echo no)" >> /tmp/hypridle-debug.log; [ $locked -eq 0 ] && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-timeout = pgrep -f "quickshell -c $HOME/.config/lockscreen" > /dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   # screen off when timeout has passed, but only if still locked
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 180                                                 # 3 minutes
    # Both halves carry the same lockscreen gate and the same LED as before —
    # they just live in the script now, so no hardware name appears in this
    # file. See scripts/kbd-backlight-idle.sh.
    on-timeout = ~/.config/scripts/kbd-backlight-idle.sh off
    on-resume = ~/.config/scripts/kbd-backlight-idle.sh restore
}
