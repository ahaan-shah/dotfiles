general {
    lock_cmd = pidof hyprlock || hyprlock              # avoid starting multiple hyprlock instances.
    ignore_dbus_inhibit = /opt/spotify/spotify
    before_sleep_cmd = loginctl lock-session           # lock before suspend.
    after_sleep_cmd = hyprctl dispatch d               # to avoid having to press a key twice to turn on the display.
}


listener {
    timeout = 120                                                 # 2 minutes
    on-timeout = loginctl lock-session                            # lock screen when timeout has passed
}

listener {
    timeout = 179
    on-timeout = brightnessctl -d asus::kbd_backlight get > /tmp/kbd_brightness_before
}

listener {
    timeout = 180                                                 # 3 minutes
    on-timeout = hyprctl dispatch dpms off                        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on                          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 180                                                 # 3 minutes
    on-timeout = brightnessctl -d asus::kbd_backlight set 0
    on-resume = bash -c 'val=$(cat /tmp/kbd_brightness_before 2>/dev/null || echo 0); [ "$val" -gt 0 ] && brightnessctl -d asus::kbd_backlight set "$val"'
}
