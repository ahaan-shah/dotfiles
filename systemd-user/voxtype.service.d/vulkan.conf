# Run the Vulkan variant (Intel Iris Xe) instead of the CPU build.
# `voxtype setup gpu --enable` does this by swapping the system binary and
# needs root; this drop-in achieves the same thing per-user and is undone by
# deleting the file. Measured on a 5s clip, base.en, warm:
#   CPU (native) 4472ms -> Vulkan 560ms
[Service]
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-vulkan -q daemon
# Keep the Vulkan loader off the dGPU and lavapipe. Unrestricted it loads every
# ICD — whisper computes on device 0 (the iGPU) regardless, but enumerating the
# NVIDIA device pulls in its driver libs and wakes the card from runtime
# suspend on every load (dGPU runtime_status: suspended -> active, measured),
# plus ~3s on the first load while it powers up. Filtered by manifest name, not
# pinned to intel_icd.json, so an AMD iGPU still works; with nothing left at
# all voxtype falls back to CPU (3.8s on an 11s clip) rather than failing.
Environment=VK_LOADER_DRIVERS_DISABLE=*nvidia*,*lvp*
