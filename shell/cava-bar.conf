; cava-bar.conf — the side bar's media waveform (Bar.qml, `wave`).
; Five levels, 0..100, one ";"-separated line per frame on stdout, read by a
; Process the bar runs only while something plays on a side bar. Not the
; user's ~/.config/cava/config (palette.sh rewrites that one's colours, and
; its bar count and output method are for a terminal).
[general]
framerate = 30
bars = 5
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 35
