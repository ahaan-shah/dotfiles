# voxtype — dictation, bound to CTRL+. in hyprland.lua (press to start,
# press again to stop and transcribe).
# @HOME@ is substituted by install.sh. Regenerate with: install.sh --only apps
state_file = "auto"

[hotkey]
# Deliberately disabled: hyprland.lua owns the binding, as a single bind on
# `voxtype record toggle`. voxtype's own hotkey grabs the key globally and
# would fight the compositor bind for it.
enabled = false
key = "SCROLLLOCK"
modifiers = []

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "base.en"
language = "en"
translate = false
# whisper's own default is 4 threads, NOT nproc. Measured on a 5s clip:
# 29.0s at the default vs 16.4s at 16 threads on small.en. Set it explicitly.
threads = 16
# The model is NOT resident: each recording spawns a `transcribe-worker` child
# that loads it and exits after the text is out. The worker starts when
# recording starts, so the ~1.1s load overlaps with speaking — measured with
# throwaway daemons on a 3s recording, stop->idle was 565ms resident vs 568ms
# isolated, while the idle daemon went 195 MB -> 27 MB RSS (the live resident
# one sat at 325 MB). The old "~62 MB resident on Vulkan" note here was wrong:
# on an iGPU "GPU memory" is system RAM (uma: 1), so the 147 MB model plus
# ~200 MB of compute buffers count in full. Only a sub-second utterance can
# outrun the load and wait on it.
gpu_isolation = true
on_demand_loading = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 0

[output.notification]
# All off: the post_process hook below sends the notification instead, because
# only it knows whether the text was typed or diverted to the clipboard.
on_recording_start = false
on_recording_stop = false
on_transcription = false

[status]
icon_theme = "emoji"

[osd]
# voxtype's own OSD logs "OSD child exited 3 times within 5s" here and never
# renders; the taskbar draws its own recording indicator instead.
enabled = false

[output.post_process]
# Schema note: this is [output.post_process] with a `command` key. The flat
# `post_process_command` form is the per-[profiles.*] variant and is NOT valid
# here. Validate any edit with:  voxtype -c <file> config
command = "@HOME@/.config/scripts/voxtype-clipboard-fallback.sh"
timeout_ms = 2000
fallback_on_empty = true
