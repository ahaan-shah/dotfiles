# Keep the dGPU asleep when the daemon STARTS, whichever engine it runs.
#
# At startup voxtype runs `nvidia-smi --query-gpu=name --format=csv,noheader`
# and `lspci`, to learn what hardware exists (caught with logging stubs on PATH,
# both the Vulkan and the ONNX build). It is only for a warning: daemon.rs's
# warn_on_variant_mismatch calls binary::inventory() to say when the installed
# build could not use the config's engine or GPU (upstream main, read 2026-11-04;
# the arguments match what 1.1.1 ran). lspci is there to spot an AMD GPU. Blocked,
# NVIDIA is still detected, through its /dev/nvidia0 fallback.
#
# That wakes the card, and one touch holds
# it awake about 20 s (measured on the real unit: restart +0.7 s resuming, active
# for 20.2 s, then suspended). So login, a model change in Settings -> Tools ->
# Voice typing, and the switch going on each cost 22 s of dGPU. vulkan.conf's
# VK_LOADER_DRIVERS_DISABLE cannot help: nothing here goes through Vulkan.
#
# Dictating never touched it (0 ms awake with the card asleep first, all four
# models), so this is the only gap. Both names now resolve to /usr/bin/false on
# this unit's PATH. Measured with that in place, start plus a 20 s dictation on
# base.en, small.en, moonshine, parakeet: 0 ms awake on each, a transcript from
# each, and no error logged. Whisper's worker still opens the iGPU's renderD128
# with the probe blocked, so the Vulkan device choice does not depend on it.
# Transcription speed with the probe blocked was not timed.
#
# %t and not a path in this repo: the directory needs no install step, and it
# vanishes at logout, so nothing is left behind if this file is deleted.
#
# PATH is replaced, not extended, because a unit's Environment= cannot refer to
# the old value. /usr/bin holds everything the post_process hook calls (hyprctl,
# wl-copy, notify-send) and wtype.
[Service]
ExecStartPre=/usr/bin/mkdir -p %t/voxtype-no-probe
ExecStartPre=/usr/bin/ln -sf /usr/bin/false %t/voxtype-no-probe/lspci
ExecStartPre=/usr/bin/ln -sf /usr/bin/false %t/voxtype-no-probe/nvidia-smi
Environment=PATH=%t/voxtype-no-probe:/usr/local/bin:/usr/bin
