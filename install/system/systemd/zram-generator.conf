# zram swap.
#
# 8G is deliberate, not a default: zram-generator's own default is
# min(RAM/2, 4096), which is where the previous 4G came from. The size is an
# UNCOMPRESSED cap rather than reserved RAM, but incompressible pages compress
# roughly 1:1 — so sizing it near total RAM is what the worst case can actually
# consume. Adjust if this machine has less than 16G.
#
# Priority is left at the generator's default (100), which puts zram ABOVE a
# /swapfile at priority 10 — that ordering matters for hibernation, which
# cannot use zram and needs the file.
[zram0]
compression-algorithm = zstd
zram-size = 8192
