theme = "spotlight"

[providers]
# What to search by default when you open Walker and start typing
default = ["desktopapplications", "files", "websearch", "calc"]

# What shows when nothing is typed yet (empty state — keeps it clean/minimal)
empty = []   # Only show apps initially, or set to [] for completely empty

# Prefixes (you can type these to force a mode)
# / = files only
# @ = web search only (or whatever you set)
# = = calculator
prefixes = [
    { provider = "files", prefix = "/" },
    { provider = "websearch", prefix = "@" },
    { provider = "calc", prefix = "=" },
]

# Custom set for clipboard-only (will be used with SUPER + V)
[providers.sets.clipboard]
default = ["clipboard"]
empty = ["clipboard"]          # Shows clipboard immediately when opened with this set

# Dedicated set for emojis (clean separate view)
[providers.sets.emojis]
default = ["symbols"]
empty = ["symbols"]        # Immediately shows emoji list when opened

[placeholders]
# Subtle Spotlight-like placeholder (shows only in the input bar)
"default" = { 
    input = "Search anything", 
    list = ""           # Empty string = hide the list area completely
}

"clipboard" = { 
    input = "Search clipboard history...", 
    list = "" 
}

"emojis" = {                     
    input = "Search emojis (e.g. smile, fire, heart)...",
    list = ""
}

# Limit results for speed and cleanliness
[providers.max_results_provider]
desktopapplications = 8
files = 10
websearch = 6
calc = 10
clipboard = 20
symbols = 25 
